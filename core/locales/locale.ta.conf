# குறியீடு மடிப்பை இயக்குவதற்கான பட்டியல் உருப்படி (குறியீட்டின் தொகுதிகளைக் காண்பித்தல்/மறைத்தல்). குறியீட்டின் மடிக்கக்கூடிய தொகுதிகள்
# பொதுவாக வகுப்புகள், செயல்பாடுகள் மற்றும் கட்டுப்பாட்டு கட்டமைப்புகள்.
Toggle Code Folding = குறியீடு மடிப்பு மாற்று
# தற்போதைய இடையகத்திற்கும் அதன்
# உரையாடல் தலைப்புக்கும் தொடரியல்-சிறப்பம்ச மொழியை மாற்றுவதற்கான பட்டியல் உருப்படி.
Select Lexer... = லெக்சரைத் தேர்ந்தெடு...
Select Lexer = லெக்சரைத் தேர்ந்தெடு
# பார்வைகளுக்கு இடையில் செல்லவும், அவற்றைப் பிரிக்கவும், அவற்றை மூடவும் மற்றும் அவற்றை மறுஅளவிடவும் பட்டியல் உருப்படிகள்.`
View = காட்சி
Next View = அடுத்த காட்சி
Previous View = முந்தைய காட்சி
Split View Horizontal = கிடமட்டமாக பிரித்தக் காட்சி
Split View Vertical = செங்குத்தாக பிரித்தக் காட்சி
Unsplit View = காட்சி சேர்
Unsplit All Views = அனைத்து காட்சிகளையும் சேர்
Grow View = கட்டக் காட்சி
Shrink View = சுருக்கக் காட்சி
# குறியீட்டின் மடிப்பு (காண்பித்தல்/மறைத்தல்) தொகுதிகளுக்கான பட்டியல் உருப்படிகள்.
Code Folding = குறியீடு மடிப்பு
Toggle Current Fold = தற்போதைய மடிப்பை மாற்று
Toggle Level 1 Folds = நிலை 1 மடிப்புகளை மாற்று
Toggle Level 2 Folds = நிலை 2 மடிப்புகளை மாற்று
Toggle Level 3 Folds = நிலை 3 மடிப்புகளை மாற்று
Collapse All Folds = அனைத்து மடிப்புகளையும் சுருக்கு
Expand All Folds = அனைத்து மடிப்புகளையும் விரிவாக்கு
# நீண்ட கோடுகளை மூடுவதற்கான பட்டியல் உருப்படி.
Toggle Wrap Mode = மடிப்பு பயன்முறையை மாற்று
# இடது வரி ஓரங்களைக் காண்பிப்பதற்கான பட்டியல் உருப்படி (வரி எண்கள், குறிப்பான்கள் போன்றவை).
Toggle Margins = விளிம்புகளை மாற்று
# வரி உள்தள்ளல் குறிப்பான்களைக் காண்பிப்பதற்கான பட்டியல் உருப்படி.
Toggle Show Indent Guides = உள்தள்ளல் வழிகாட்டிகளைக் காட்டு என்பதை மாற்று
# இடைவெளிகள் மற்றும் தாவல்களைக் காட்சி ரீதியாகக் காண்பிப்பதற்கான பட்டியல் உருப்படி.
Toggle View Whitespace = வெள்ளை இடத்தை மாற்று
# கேரட்டை வரி முனைகளுக்கு அப்பால் "மெய்நிகர் இடத்திற்கு" நகர்த்த அனுமதிப்பதற்கான பட்டியல் உருப்படி.
Toggle Virtual Space = மெய்நிகர் இடத்தை மாற்று
# காட்டப்படும் இடையக உரையின் பெரிதாக்கு காரணியை மாற்றுவதற்கான பட்டியல் உருப்படிகள்.
Zoom In = பெரிதாக்கு உள்
Zoom Out = பெரிதாக்கு வெளி
Reset Zoom = பெரிதாக்கு மீட்டமை
# Textadept மற்றும் அதன் Lua API ஆவணங்களில் உதவி பெறுவதற்கான பட்டியல் உருப்படிகள்.
Help = உதவி
Show Manual = கையேட்டைக் காட்டு
Show LuaDoc = லூஅஆவணத்தைக் காட்டு
About = பற்றி
# தன்னிச்சையான பட்டியல் கட்டளையை இயக்குவதற்கான உரையாடலில் காட்டப்படும் உரை. எந்த விசை பிணைப்பும்
# கட்டளைகளுடன் தொடர்புடையது.
Run Command = இயக்கு கட்டளை
Command = கட்டளை
Key Binding = விசை பிணைப்பும்

# [modules/textadept/run.lua]
# ஒரு தொகு/இயக்கு/கட்டு/சோதனை/திட்டம் கட்டளை வெற்றிபெறும்போதோ அல்லது தோல்வியடையும்போதோ காட்டப்படும் உரை.
Command succeeded = கட்டளை வெற்றி
Command failed = கட்டளை தோல்வி
# தொகு/இயக்கு/கட்டு/சோதனை/திட்டம் கட்டளை உள்ளீட்டில் காட்டப்படும் உரை.
Compile command: = தொகு கட்டளை:
Run command: = இயக்கு கட்டளை:
Build command: = கட்டு கட்டளை:
Test command: = சோதனை கட்டளை:
Project run command: = திட்டம் இயக்கு கட்டளை:
# நிறுத்த வேண்டிய செயல்முறையைத் தேர்ந்தெடுப்பதற்கான உரையாடலின் தலைப்பு.
Stop Process = செயல்முறை நிறுத்து

# [modules/textadept/session.lua]
# ஏற்றுவதற்கு ஒரு அமர்வு கோப்பைத் தேர்ந்தெடுப்பதற்கான உரையாடலின் தலைப்பு.
Load Session = அமர்வு ஏற்று
# ஏற்றப்பட்ட அமர்வில் கோப்புகள் காணப்படாதபோது உரையாடலில் காட்டப்படும் உரை.
Session Files Not Found = அமர்வு கோப்புகள் காணப்படவில்லை
The following session files were not found: = பின்வரும் அமர்வு கோப்புகள் காணப்படவில்லை:
# சேமிக்க ஒரு அமர்வு கோப்பைத் தேர்ந்தெடுப்பதற்கான உரையாடலின் தலைப்பு.
Save Session = அமர்வு சேமி

# [modules/textadept/snippets.lua]
# செருக ஒரு துணுக்கைத் தேர்ந்தெடுப்பதற்கான உரையாடலில் காட்டப்படும் உரை. துணுக்குகளுக்கு ஒரு தூண்டுதல் உள்ளது
# சொல் (அந்த வார்த்தை துணுக்கைச் செருகிய பிறகு "தாவல்" விசையை அழுத்தினால்) மற்றும் துணுக்கு உரை.

Select Snippet = துணுக்கைத் தேர்ந்தெடு
Trigger = தூண்டுதல்
Snippet Text = துணுக்கு உரை
# ஒரு துணுக்கு செருகப்படும்போது நிலைப்பட்டியில் காட்டப்படும் செய்தி.
Snippet active = துணுக்கு செயலில்
