# பதிப்புரிமை 2007-2025 மிட்செல். உரிமத்தைப் பார்க்கவும்.
# உரைதிறமைக்கான தமிழ்நாட்டு தமிழ் மொழியாக்கக் கோப்பு.
#
# இந்தக் கோப்பை உங்கள் தாய்மொழியில் மொழிபெயர்க்கும்போது, ​​மொழிபெயர்க்கப்பட்ட அனைத்து உரைகளும்
# UTF-8 இல் குறியாக்கம் செய்யப்பட வேண்டும். ஒவ்வொரு "key = மதிப்பு" வரிக்கும், தயவுசெய்து "மதிப்பு" பகுதியை
# "key" இன் மொழிபெயர்ப்புடன் மாற்றவும். '=' ஐச் சுற்றியுள்ள எந்த இடைவெளியும் புறக்கணிக்கப்படும்.
#
# குறிப்பு: அதை ஆதரிக்கும் மொழிகளுக்கு, பொத்தான்கள் மற்றும் பட்டியல் உருப்படிகள் எந்த ஒற்றை
# எழுத்திற்கும் முன் "_" இருக்கலாம், அதாவது "Alt" மாற்றி விசையை அந்த எழுத்தோடு சேர்த்து அழுத்தினால்
# பொத்தான் அல்லது பட்டியல் உருப்படி செயல்படுத்தப்படும்
# (கிளிக் செய்யவும்). உங்கள்
# மொழிபெயர்ப்புகளிலிருந்து இந்த "_" நினைவூட்டல்களைப் பயன்படுத்தவோ அல்லது தவிர்க்கவோ நீங்கள் சுதந்திரமாக இருக்கிறீர்கள்.

